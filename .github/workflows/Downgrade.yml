name: Downgrade
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.num_threads }} threads
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
        os: ['ubuntu-latest']
        num_threads: [1, 2]

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2.7.0
        with:
          mode: deps
          projects: ".,test"
          skip: Logging,Test
      - run: julia --color=yes --project=test -e 'using Pkg; Pkg.instantiate()'
      - run: julia --color=yes --project=test --check-bounds=yes --depwarn=yes --code-coverage=@${{ github.workspace }} test/runtests.jl
        env:
          JULIA_NUM_THREADS: ${{ matrix.num_threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
