name: Downgrade
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.num_threads }} threads
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
        os: ['ubuntu-latest']
        num_threads: [1, 2]

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2.7.0
        with:
          mode: deps
          projects: ".,test"
          skip: Logging,Test
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: "test"
      - run: |
          import Pkg
          Pkg.develop(Pkg.PackageSpec(path=pwd()))
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
          include(joinpath(pwd(), "test", "runtests.jl"))
        shell: julia --color=yes --project=test/ --check-bounds=yes --depwarn=yes --code-coverage=@ {0}
        env:
          JULIA_NUM_THREADS: ${{ matrix.num_threads }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          file: lcov.info
